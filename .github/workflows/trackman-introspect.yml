name: Introspect the Trackman schema

# Manual, and on pushes to the introspection branch only. `workflow_dispatch` alone would not be
# usable here: GitHub only offers that trigger for workflows already on the default branch.
#
# Never pull_request_target or workflow_run: this repo is public, and those triggers run with
# secret access under attacker-influenced conditions.
on:
  push:
    branches: ['feat/per-shot-metrics']
  workflow_dispatch:

# Nothing. The job reads a schema and writes an artifact; it touches no repository content.
permissions: {}

concurrency:
  group: trackman-introspect
  cancel-in-progress: true

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, not tags, because this job holds the Trackman credential.
      # A tag is a movable pointer; a SHA is not. The trailing comment records the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Read the schema
        # The token reaches the script through the environment, never through interpolation into
        # the command line. It is never echoed, never written to a file, and never included in an
        # error message — a failed token exchange reports its HTTP status only.
        env:
          TRACKMAN_REFRESH_TOKEN: ${{ secrets.TRACKMAN_REFRESH_TOKEN }}
        run: npm run introspect

      # Which fields exist is not which fields are populated. This prints **aggregates only** —
      # null rates, ranges, correlations — the same class of figure `docs/architecture.md`
      # already publishes. No individual reading reaches the log.
      - name: Probe the real readings
        env:
          TRACKMAN_REFRESH_TOKEN: ${{ secrets.TRACKMAN_REFRESH_TOKEN }}
        run: npm run probe

      # The GraphQL schema only. Artifacts on a public repository are publicly downloadable, so
      # no stroke data is fetched by this job at all — per-shot readings are the user's own, and
      # keeping them off a public channel is precisely what Phase 6 was for.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trackman-schema
          path: introspection.json
          retention-days: 7
