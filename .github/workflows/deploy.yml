name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never add pull_request_target or workflow_run: this repo is public, and those triggers
# run with secret access under attacker-influenced conditions.

# Actions are pinned to full commit SHAs, not tags. This job holds `pages: write` and
# `id-token: write`, so a retagged or compromised action could publish to golf.whitfield.life.
# A tag is a movable pointer; a SHA is not. The trailing comment records the version each SHA
# corresponds to — update both together, never the comment alone.

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CNAME and the 404 shim survived the build
        # Losing CNAME drops the custom domain; losing 404.html breaks every deep link
        # (/log). Both fail silently otherwise — the site still builds and still deploys.
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing — the custom domain would be dropped"; exit 1; }
          grep -qx 'golf.whitfield.life' dist/CNAME || { echo "::error::dist/CNAME has unexpected contents"; exit 1; }
          test -f dist/404.html || { echo "::error::dist/404.html is missing — deep links like /log would 404"; exit 1; }
          grep -q 'id="app"' dist/404.html || { echo "::error::dist/404.html is not the built app shell"; exit 1; }

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
