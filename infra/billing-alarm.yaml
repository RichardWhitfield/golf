AWSTemplateFormatVersion: '2010-09-09'
Description: Billing alarm for the golf practice store

# **Deploy this to us-east-1, not ap-southeast-2.** AWS publishes the AWS/Billing namespace in
# us-east-1 only, regardless of where the resources being billed actually live. An alarm on this
# metric created in any other region sits in INSUFFICIENT_DATA for ever and never fires.
#
# Plain CloudFormation, no SAM transform — there is nothing serverless in here.
#
# The point is not the ~3p/month of expected usage. It is misconfiguration: provisioned capacity
# left running, or a retry loop. This turns a surprise bill into an email.

Parameters:
  AlarmEmail:
    Type: String
    Description: Address to notify if estimated charges exceed one dollar.

Resources:
  BillingTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: golf-estimated-charges
      AlarmDescription: Estimated AWS charges have exceeded one dollar.
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      # Billing metrics update roughly every six hours, so a shorter period only produces gaps.
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      # Missing data is normal between the six-hourly updates and must not read as a breach.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BillingTopic
